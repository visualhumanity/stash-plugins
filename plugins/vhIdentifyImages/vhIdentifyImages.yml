name: VH - Identify Images
description: Identify for images. Scrapes images under chosen folders with an image scraper and applies the results using Identify's ignore, merge and overwrite rules.
version: 0.1.0
exec:
  - python
  - "{pluginDir}/vhIdentifyImages.py"
interface: raw
tasks:
  - name: Identify images
    description: Scrapes every image under the configured folders with the configured scraper and applies the results using the field options. Turn on Dry run to see the changes without writing them.
    defaultArgs:
      mode: identify
settings:
  scraperId:
    displayName: Scraper ID
    description: ID of the image scraper to run on each image. Empty means GalleryDlReddit.
    type: STRING
  folderPrefixes:
    displayName: Folder prefixes
    description: "Only images whose file path starts with one of these are processed. Separate several with |, for example /data/example/reddit/|/data/example/twitter/. Empty means all images."
    type: STRING
  fieldTitle:
    displayName: Title option
    description: ignore, merge or overwrite. Empty means merge (set only when the image has no title).
    type: STRING
  fieldCode:
    displayName: Code option
    description: ignore, merge or overwrite. Empty means merge (set only when the image has no code).
    type: STRING
  fieldDetails:
    displayName: Details option
    description: ignore, merge or overwrite. Empty means merge (set only when the image has no details).
    type: STRING
  fieldDate:
    displayName: Date option
    description: ignore, merge or overwrite. Empty means merge (set only when the image has no date).
    type: STRING
  fieldUrls:
    displayName: URLs option
    description: ignore, merge or overwrite. Empty means merge (add scraped URLs that are not already on the image).
    type: STRING
  fieldPerformers:
    displayName: Performers option
    description: ignore, merge or overwrite. Empty means merge (add matched performers to the existing ones).
    type: STRING
  fieldTags:
    displayName: Tags option
    description: ignore, merge or overwrite. Empty means merge (add matched tags to the existing ones).
    type: STRING
  fieldStudio:
    displayName: Studio option
    description: ignore, merge or overwrite. Empty means merge (set only when the image has no studio).
    type: STRING
  createMissingPerformers:
    displayName: Create missing performers
    description: Create scraped performers that do not exist in Stash yet (with their scraped name, disambiguation and URLs), then link them. Off means they are dropped.
    type: BOOLEAN
  createMissingTags:
    displayName: Create missing tags
    description: Create scraped tags that do not exist in Stash yet, then link them. Off means they are dropped.
    type: BOOLEAN
  createMissingStudios:
    displayName: Create missing studios
    description: Create a scraped studio that does not exist in Stash yet (with its scraped name, URLs and parent, creating a missing parent first), then link it. As in Identify, an existing parent gets the scraped parent's fields written to it. Off means the studio is dropped.
    type: BOOLEAN
  skipSingleNamePerformers:
    displayName: Skip single-name performers
    description: Do not create a performer whose name has no space and who has no disambiguation, as in Identify. Keep off for Reddit uploaders such as u_example_user.
    type: BOOLEAN
  dryRun:
    displayName: Dry run
    description: Log each image's changes (field, old value, new value) without writing anything.
    type: BOOLEAN
  imageLimit:
    displayName: Image limit
    description: Stop after this many images. 0 or empty means no limit.
    type: NUMBER
