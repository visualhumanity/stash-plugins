name: VH - Player Aspect Ratio Fix
description: Adds an aspect ratio button to the scene player's control bar that stretches the playing picture to 16:9, 4:3 or 1:1. Playback only; files and metadata are not changed.
version: 1.0.0
ui:
  javascript:
    - vhPlayerAspectRatioFix.js
  css:
    - vhPlayerAspectRatioFix.css
settings:
  shrinkToFit:
    displayName: Shrink to fit
    description: Scale a stretched picture down so it stays fully inside the player instead of being cropped at the edges. Off until turned on.
    type: BOOLEAN
