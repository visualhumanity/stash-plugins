name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install optional test dependencies
        run: pip install pyyaml
      - name: Run tests
        run: python3 -m unittest discover -t . -s tests/ -p "test_*.py" -v
