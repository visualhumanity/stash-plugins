name: Test, build and deploy to GitHub Pages

# Publishes main and develop side by side:
#   <pages url>/main/index.yml
#   <pages url>/develop/index.yml
# A Pages artifact deploy replaces the whole site, so every deploy rebuilds both branches.

on:
  push:
    branches: [main, develop]
    paths:
      - 'plugins/**'
      - 'themes/**'
      - 'build_site.sh'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'plugins/**'
      - 'themes/**'
      - 'build_site.sh'
      - 'tests/**'
      - '.github/workflows/**'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# Publishing runs (pushes and manual runs on main or develop) go one at a time, in order,
# so a slower older run can't deploy over a newer one. queue: max keeps every waiting run
# instead of cancelling all but the newest. Runs that can't deploy (PRs, manual runs on
# other branches) get their own group.
concurrency:
  group: >-
    ${{ github.event_name != 'pull_request'
    && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    && 'pages' || format('nopublish-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max

jobs:
  # Pins the commits this run tests and builds, so everything deployed has been tested.
  # On a PR: the feature branch head (never GitHub's merge commit).
  # Otherwise: the current tips of main and develop, both of which get published.
  refs:
    runs-on: ubuntu-latest
    outputs:
      main: ${{ steps.resolve.outputs.main }}
      develop: ${{ steps.resolve.outputs.develop }}
      test-shas: ${{ steps.resolve.outputs.test-shas }}
    steps:
      - name: Resolve commits
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "test-shas=[\"$PR_HEAD\"]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          remote="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          main=$(git ls-remote "$remote" refs/heads/main | cut -f1)
          develop=$(git ls-remote "$remote" refs/heads/develop | cut -f1)
          if [ -z "$main" ] || [ -z "$develop" ]; then
            echo "::error::Could not resolve main ($main) or develop ($develop)"
            exit 1
          fi
          echo "main=$main develop=$develop"
          echo "main=$main" >> "$GITHUB_OUTPUT"
          echo "develop=$develop" >> "$GITHUB_OUTPUT"
          if [ "$main" = "$develop" ]; then
            echo "test-shas=[\"$main\"]" >> "$GITHUB_OUTPUT"
          else
            echo "test-shas=[\"$main\",\"$develop\"]" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: refs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sha: ${{ fromJSON(needs.refs.outputs.test-shas) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
      - name: Install optional test dependencies
        run: pip install pyyaml
      - name: Run tests
        run: python3 -m unittest discover -t . -s tests/ -p "test_*.py" -v

  build:
    needs: refs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read   # to look up the last successful run
    outputs:
      publish: ${{ steps.changes.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: build_site.sh derives each package version from git log
          fetch-depth: '0'
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build PR feature branch
        if: github.event_name == 'pull_request'
        run: bash ./build_site.sh "$PWD/_site/pr"

      - name: Build main and develop
        if: github.event_name != 'pull_request'
        env:
          MAIN_SHA: ${{ needs.refs.outputs.main }}
          DEVELOP_SHA: ${{ needs.refs.outputs.develop }}
        run: |
          for branch in main develop; do
            # The same commits the test job tested
            sha_var="${branch^^}_SHA"
            git worktree add --detach "$RUNNER_TEMP/src-$branch" "${!sha_var}"
            # build_site.sh reads plugins/ and git history relative to the current directory
            (cd "$RUNNER_TEMP/src-$branch" && bash ./build_site.sh "$GITHUB_WORKSPACE/_site/$branch")
          done

      - name: Decide whether to deploy
        id: changes
        if: github.event_name != 'pull_request'
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ needs.refs.outputs.main }}
          DEVELOP_SHA: ${{ needs.refs.outputs.develop }}
        run: |
          # Every deploy publishes both branches, so deploy if either branch has
          # published inputs that changed since its last successful push run.
          # A run that failed published nothing, so its changes still count.
          # Only push runs count as a baseline: PR runs never deploy.
          # Manual runs, and a branch with no usable previous push run, always deploy.
          publish=false
          if [ "$EVENT" != push ]; then
            publish=true
          else
            for branch in main develop; do
              sha_var="${branch^^}_SHA"
              sha="${!sha_var}"
              last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml \
                --branch "$branch" --event push --status success --limit 1 \
                --json headSha --jq '.[0].headSha // ""')
              echo "$branch: pinned ${sha}, last successful push run ${last:-none}"
              if [ -z "$last" ] || ! git cat-file -e "$last^{commit}" 2>/dev/null; then
                publish=true
                continue
              fi
              changed=$(git diff --name-only "$last" "$sha")
              if grep -qE '^(plugins/|themes/|build_site\.sh$|\.github/workflows/)' <<<"$changed"; then
                echo "$branch has published changes:"
                echo "$changed"
                publish=true
              fi
            done
          fi
          echo "publish=$publish"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: [refs, build, test]
    if: >-
      github.event_name != 'pull_request'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
      && needs.build.outputs.publish == 'true'
    # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}${{ github.ref_name }}/index.yml
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
